name: Build deb package

on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Extract version from release tag
        env:
          RAW_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${RAW_TAG#v}"
          case "$VERSION" in
            ''|[!0-9]*|*[!0-9A-Za-z.+:~-]*)
              echo "Release tag must contain a Debian version, optionally prefixed with v" >&2
              exit 1
              ;;
          esac
          printf 'PACKAGE_VERSION=%s\n' "$VERSION" >> "$GITHUB_ENV"
          printf 'Extracted version: %s\n' "$VERSION"

      - name: Build AMD64 deb package
        run: bash ./devops/build-deb.sh

      - name: Upload package to GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/moderator-launcher_${{ env.PACKAGE_VERSION }}_amd64.deb
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
