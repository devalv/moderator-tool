name: Build Windows app artifact

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Build Windows AMD64
        run: |
          make build-win-11
          cp dist/win-11/Moderator-Launcher.exe dist/Moderator-Launcher-windows-amd64.exe

      - name: Upload artifact to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/Moderator-Launcher-windows-amd64.exe
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload workflow artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Moderator-Launcher-windows-amd64.exe
          path: dist/Moderator-Launcher-windows-amd64.exe
          if-no-files-found: error
          retention-days: 7
